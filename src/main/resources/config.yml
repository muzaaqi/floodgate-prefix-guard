# Konfigurasi FloodgatePrefixGuard

# Jika true: Plugin akan otomatis mengunduh versi terbaru dari GitHub dan memasangnya saat restart.
# Jika false: Hanya memberi notifikasi di console jika ada update baru.
auto-update: true

# Prefix yang wajib dimiliki oleh pemain Bedrock (biasanya ".")
required-prefix: "."

# [FITUR BARU] Whitelist Mode / Linked Account Bypass
# Jika true: Pemain Bedrock yang sudah LINK akun ke Java (Global Linking) BOLEH masuk
# meskipun nama mereka tidak ada prefix "." (Karena UUID mereka sudah aman/sama dengan Java)
allow-linked-bypass: true

# Jika true: Mengirim pesan chat ke admin yang sedang online saat ada pemain Bedrock ditendang.
staff-notify: true
# Format pesan notifikasi (%player% akan diganti dengan nama pemain)
staff-notify-message: "&c[Guard] &e%player% &7kicked for missing prefix."

# Pesan Kick (Support warna &)
kick-message:
  - "&c&l[Guard] Your Bedrock ID is missing the required name prefix!"
  - ""
  - "&7S."
  - "&7For data security (UUID), the connection has been terminated."
  - ""
  - "&ePlease relogin to the server."